# Dependabot version updates, modelled on the SMSwitch configuration.
#
# Every entry ignores semver-major updates: a major bump is a deliberate, reviewed act, not
# something that arrives while nobody is looking. Security updates are not affected by these
# ignore rules and still arrive for any version that fixes an advisory.
version: 2

updates:
  - package-ecosystem: "nuget"
    # Versions live in each .csproj, so the project folders are listed individually. The repository
    # root is deliberately absent: the solution there resolves these same projects, and listing both
    # makes Dependabot discover every dependency twice and open a catch-all PR over the grouped ones.
    directories:
      - "/src/SignedChannel"
      - "/src/SignedChannel.MongoDb"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Updates are split into separate pull requests per group. Dependabot puts a dependency in every
    # group whose patterns match it (not just the first), so the catch-all "third-party" group lists
    # the other groups' patterns under exclude-patterns. Without them, any third-party update in a
    # run produced one superset pull request that replaced the narrower ones.
    groups:
      own-packages:
        # Sibling packages from github.com/prmeyn, listed by name because they share no prefix.
        patterns:
          - "Meyn.Utilities"
          - "MongoDbService"
          - "PublicKeyUtils"
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
      third-party:
        patterns:
          - "*"
        # "*" alone would also match every package above: Dependabot puts a dependency in
        # every group it matches, not just the first. These exclusions make this group
        # really mean "everything else". Keep them in step with the groups above.
        exclude-patterns:
          - "Meyn.Utilities"
          - "MongoDbService"
          - "PublicKeyUtils"
          - "Microsoft.*"
          - "System.*"

  - package-ecosystem: "npm"
    # The browser client published alongside the NuGet packages.
    directory: "/clients/signed-channel-client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    # Always the repo root; Dependabot reads .github/workflows from there.
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
