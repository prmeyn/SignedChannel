name: Release

# The git tag is the single source of truth for the version: it stamps the NuGet package and the
# npm package alike, so the two halves of the protocol can never drift apart. The versions
# committed in Directory.Build.props and package.json are only defaults for local builds.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # NuGet Trusted Publishing (OIDC) and npm provenance

    steps:
      - name: Checkout
        # Pinned to a commit SHA rather than a tag: a tag can be repointed, and this job holds an
        # id-token that can publish. Comments record the human-readable version.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify commit exists in origin/main
        run: |
          git fetch --no-tags --prune --depth=1 origin +refs/heads/*:refs/remotes/origin/*
          git branch --remote --contains | grep origin/main

      - name: Set VERSION variable from tag
        run: echo "VERSION=${GITHUB_REF/refs\/tags\/v/}" >> $GITHUB_ENV

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships 11.1.x, which silently cannot do
      # the OIDC exchange at all — it just publishes unauthenticated and the registry answers
      # 404 on the PUT (npm returns 404 rather than 401 so it never reveals whether a package
      # exists). Upgrading is what makes OIDC actually available.
      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      # ---- build everything before publishing anything ----------------------------------------
      # Both halves are built and packed first, so a green build cannot publish one registry and
      # then fail on the other, leaving the pair half-released.

      - name: Build (.NET)
        run: dotnet build --configuration Release -p:Version=${VERSION}

      - name: Pack (.NET)
        run: dotnet pack --configuration Release -p:Version=${VERSION} --no-build --output ./artifacts

      - name: Build (npm)
        working-directory: clients/signed-channel-client
        run: |
          npm ci
          npm version ${VERSION} --no-git-tag-version --allow-same-version
          npm run build

      # ---- publish ----------------------------------------------------------------------------

      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: globalpay

      - name: Push (NuGet)
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key ${NUGET_API_KEY} --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

      # Authenticates via OIDC (trusted publishing) using the id-token granted above — there is
      # deliberately no NODE_AUTH_TOKEN here. It must stay absent rather than empty: setup-node
      # v7 removed the dummy NODE_AUTH_TOKEN export, so an empty value would leave the generated
      # .npmrc with an unresolved _authToken instead of falling through to OIDC.
      # Publishes from the package directory, not a pre-packed .tgz: npm's trusted-publishing
      # docs only ever demonstrate the directory form, and this is not the place to be off the
      # documented path. prepack rebuilds and copies LICENSE/NOTICE, so the contents are the same.
      - name: Publish (npm)
        working-directory: clients/signed-channel-client
        run: npm publish
