name: Release

# The git tag is the single source of truth for the version: it stamps the NuGet package and the
# npm package alike, so the two halves of the protocol can never drift apart. The versions
# committed in Directory.Build.props and package.json are only defaults for local builds.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # NuGet Trusted Publishing (OIDC) and npm provenance

    steps:
      - name: Checkout
        # Pinned to a commit SHA rather than a tag: a tag can be repointed, and this job holds an
        # id-token that can publish. Comments record the human-readable version.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify commit exists in origin/main
        run: |
          git fetch --no-tags --prune --depth=1 origin +refs/heads/*:refs/remotes/origin/*
          git branch --remote --contains | grep origin/main

      - name: Set VERSION variable from tag
        run: echo "VERSION=${GITHUB_REF/refs\/tags\/v/}" >> $GITHUB_ENV

      # TODO: pin these two to commit SHAs, as above, once their current SHAs are looked up.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # ---- build everything before publishing anything ----------------------------------------
      # Both halves are built and packed first, so a green build cannot publish one registry and
      # then fail on the other, leaving the pair half-released.

      - name: Build (.NET)
        run: dotnet build --configuration Release -p:Version=${VERSION}

      - name: Pack (.NET)
        run: dotnet pack --configuration Release -p:Version=${VERSION} --no-build --output ./artifacts

      - name: Build (npm)
        working-directory: clients/signed-channel-client
        run: |
          npm ci
          npm version ${VERSION} --no-git-tag-version --allow-same-version
          npm pack

      # ---- publish ----------------------------------------------------------------------------

      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: globalpay

      - name: Push (NuGet)
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key ${NUGET_API_KEY} --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

      - name: Publish (npm)
        working-directory: clients/signed-channel-client
        run: npm publish signed-channel-client-${VERSION}.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
